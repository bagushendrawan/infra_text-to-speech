[project]
name = "text-to-speech"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "pydantic-settings>=2.4", "qwen-tts==0.1.1", "torch", "soundfile"]
[project.optional-dependencies]
inference = []
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "soundfile", "numpy"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
cache-dir = "../.cache/uv"
link-mode = "hardlink"
